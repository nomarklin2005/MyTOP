name: Daily TXO Delta Update

on:
  schedule:
    # 設定 UTC 時間每天早上 06:00 執行（相當於台灣時間 14:00 盤後自動更新）
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 上手動按鈕觸發更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: 執行計算腳本
        run: python update_data.py

      - name: 自動提交並推送更新後的 data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update TXO Delta data [skip ci]" || exit 0
          git push